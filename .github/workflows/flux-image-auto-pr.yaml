---
name: flux-image-auto-pr
on:
  push:
    branches: [flux-image-automation, main]

permissions: {}

concurrency:
  # Keep a main push from replacing a pending Flux push; expected heads guard
  # updates between the two ref queues.
  group: flux-image-auto-pr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pr:
    environment: flux-image-automation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Mint infra-flux installation token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.FLUX_APP_ID }}
          private-key: ${{ secrets.FLUX_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Check out the trusted workflow helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          token: ${{ steps.token.outputs.token }}
          persist-credentials: false

      - name: Refresh the image PR and retain normal auto-merge
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          FLUX_PUSH_REF: ${{ github.ref }}
          FLUX_PUSH_SHA: ${{ github.sha }}
        run: python3 scripts/flux-image-auto-pr.py
