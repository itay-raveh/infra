---
name: recovery-test
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
env:
  MISE_LOCKED: "1"
jobs:
  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5
        with:
          install_args: age flux2 jq kind kubectl github:minio/mc sops yq
      - run: mise run --skip-tools test:integration
