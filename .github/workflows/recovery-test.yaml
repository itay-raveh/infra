---
name: recovery-test
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  MISE_LOCKED: "1"
jobs:
  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4
        with:
          install_args: age flux2 kind kubectl mc sops yq
      - run: mise run --skip-tools test:integration
