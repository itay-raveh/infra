---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1m0s
  provider: github
  verify:
    mode: HEAD
    secretRef:
      name: git-verification
  ref:
    branch: main
  secretRef:
    name: flux-github-app
  url: https://github.com/itay-raveh/infra.git
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./clusters/shire
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
