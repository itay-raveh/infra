---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: quizmon-spending-guard
  namespace: quizmon-ops
spec:
  schedule: "*/5 * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 60
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 90
      backoffLimit: 0
      template:
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: monitor
              image: node:24.15.0-alpine@sha256:d1b3b4da11eefd5941e7f0b9cf17783fc99d9c6fc34884a665f40a06dbdfc94f
              command: [node, /app/guard.mjs, check]
              env:
                - name: CLOUDFLARE_ACCOUNT_ID
                  value: d695541408d207c8e7750de4fddf5bf5
                - name: CLOUDFLARE_ZONE_ID
                  value: 4be281e220538b2ad2def80f8f5150a5
                - name: SPENDING_KV_NAMESPACE_ID
                  value: d74e8bc9c72f4691a8595b2591adb7da
                - name: QUIZMON_HOSTNAME
                  value: quizmon.raveh.dev
                - name: BUDGET_USD
                  value: "1"
                - name: CLOUDFLARE_API_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: cloudflare-spending-guard
                      key: token
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: script
                  mountPath: /app
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: quizmon-spending-guard
