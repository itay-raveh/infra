---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: quizmon-operator
  namespace: flux-system
spec:
  suspend: false
  interval: 10m
  path: ./clusters/shire/apps/quizmon/operator
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: infrastructure
  wait: true
  timeout: 15m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: quizmon-database
  namespace: flux-system
spec:
  suspend: false
  interval: 10m
  path: ./clusters/shire/apps/quizmon/database
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: infrastructure
    - name: quizmon-operator
  wait: true
  timeout: 15m
  healthCheckExprs:
    - apiVersion: psmdb.percona.com/v1
      kind: PerconaServerMongoDB
      failed: status.state == 'error'
      current: status.state == 'ready'
    - apiVersion: postgresql.cnpg.io/v1
      kind: Database
      failed: has(status.applied) && !status.applied
      current: has(status.applied) && status.applied && status.observedGeneration == metadata.generation
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: quizmon-release
  namespace: flux-system
spec:
  suspend: false
  interval: 5m
  path: ./clusters/shire/apps/quizmon/release
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: quizmon-database
  wait: true
  timeout: 10m
