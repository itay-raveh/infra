apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: percona
  namespace: quizmon
spec:
  interval: 1h
  url: https://percona.github.io/percona-helm-charts/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: quizmon-mongodb-crds
  namespace: quizmon
spec:
  interval: 10m
  chart:
    spec:
      chart: psmdb-operator-crds
      version: 1.23.1
      sourceRef:
        kind: HelmRepository
        name: percona
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: quizmon-mongodb-operator
  namespace: quizmon
spec:
  interval: 10m
  dependsOn:
    - name: quizmon-mongodb-crds
  chart:
    spec:
      chart: psmdb-operator
      version: 1.23.1
      sourceRef:
        kind: HelmRepository
        name: percona
  values:
    watchNamespace: quizmon
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1001
      runAsGroup: 1001
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi
