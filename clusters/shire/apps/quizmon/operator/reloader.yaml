apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: stakater
  namespace: quizmon
spec:
  interval: 1h
  url: https://stakater.github.io/stakater-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: quizmon-reloader
  namespace: quizmon
spec:
  interval: 10m
  chart:
    spec:
      chart: reloader
      version: 2.2.16
      sourceRef:
        kind: HelmRepository
        name: stakater
  values:
    reloader:
      watchGlobally: false
      reloadStrategy: annotations
