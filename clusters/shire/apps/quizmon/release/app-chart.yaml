apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: quizmon-chart
  namespace: quizmon
spec:
  interval: 5m
  url: oci://ghcr.io/itay-raveh/charts/quizmon
  ref:
    semver: ">=0.0.0"
    semverFilter: '^[0-9]+\.[0-9]+\.[0-9]+$'
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: quizmon
  namespace: quizmon
spec:
  interval: 5m
  releaseName: online
  timeout: 10m
  chartRef:
    kind: OCIRepository
    name: quizmon-chart
  install:
    remediation:
      retries: 0
  upgrade:
    remediation:
      retries: 0
  valuesFrom:
    - kind: ConfigMap
      name: quizmon-runtime
      valuesKey: values.yaml
  values:
    runtimeConfig:
      workerName: quizmon
      origin: https://quizmon.raveh.dev
      sync:
        endpoint: https://quizmon-sync.raveh.dev
        audience: quizmon
      mailFrom: quizmon@raveh.dev
      authRateLimitNamespace: "1011"
      apiRateLimitNamespace: "1012"
    sync:
      enabled: true
      mongoSecret:
        name: quizmon-mongo-custom-user-secret-conn-str
        key: quizmon_rs0_connectionString
      mongoTlsSecret:
        name: quizmon-mongo-ssl
