---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: wanderbound-backup
  namespace: wanderbound
spec:
  instanceSidecarConfiguration:
    env:
      - name: AWS_RETRY_MODE
        value: standard
      - name: AWS_MAX_ATTEMPTS
        value: "10"
    retentionPolicyIntervalSeconds: 86400
  configuration:
    destinationPath: "s3://shire-backups/cnpg/wanderbound/"
    endpointURL: "https://fsn1.your-objectstorage.com"
    s3Credentials:
      accessKeyId:
        name: cnpg-s3-creds
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: cnpg-s3-creds
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
  retentionPolicy: "30d"
