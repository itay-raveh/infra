#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "local"

[[repos.hooks]]
id = "betterleaks"
name = "betterleaks"
language = "system"
entry = "betterleaks git --pre-commit --redact --staged --verbose"
pass_filenames = false

[[repos.hooks]]
id = "sops-sanity"
name = "sops-sanity"
language = "system"
entry = "scripts/sops-sanity.sh"
pass_filenames = false
always_run = true

[[repos.hooks]]
id = "yamllint"
name = "yamllint"
language = "system"
entry = "bash scripts/lint-yaml.sh"
types = ["yaml"]
exclude = '\.sops\.(yaml|yml)$|^clusters/shire/infrastructure/controllers/barman-cloud-plugin/manifest\.yaml$'

[[repos.hooks]]
id = "shellcheck"
name = "shellcheck"
language = "system"
entry = "shellcheck"
types = ["shell"]

[[repos.hooks]]
id = "tofu-fmt"
name = "tofu fmt"
language = "system"
entry = "tofu fmt -check"
files = '\.(tf|tfvars|tftest\.hcl|tofu|tofutest\.hcl)$'

[[repos.hooks]]
id = "actionlint"
name = "actionlint"
language = "system"
entry = "actionlint"
files = '^\.github/workflows/.*\.ya?ml$'

[[repos.hooks]]
id = "zizmor"
name = "zizmor"
language = "system"
entry = "zizmor --offline .github/workflows"
files = '^\.github/workflows/.*\.ya?ml$'
pass_filenames = false
